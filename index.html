<style>
/* Layout: one phone-width column, sticky cash bar on top, five-tab dock fixed to the bottom, bottom sheets for details */
:root{
  --bg:#090c0b;--surface:#121715;--surface2:#19201d;--line:#24302b;
  --text:#f1f5f2;--muted:#8b9a92;--dim:#5f6d66;
  --em:#1fc983;--em-deep:#0e7a4f;--gold:#e4b95b;--gold-deep:#8a6a22;--red:#ff6b62;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:600 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 75%,rgba(9,12,11,0));display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 14px}
.brand{font:800 12px/1 var(--display);letter-spacing:.14em;color:var(--gold)}
.brand span{color:var(--text)}
.topr{display:flex;align-items:center;gap:8px}
.help{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--gold);font:800 15px var(--display);display:grid;place-items:center}
.ilist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ilist li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--muted);font-size:14.5px;line-height:1.45}
.ilist li b{color:var(--text)}
.ilist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--em);margin:7px 0 0 7px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:20px;border-radius:9px}
.cashchip{display:flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.cashchip b{color:var(--em);font-weight:800}
h2{font:700 15px/1.2 var(--display);margin:0;letter-spacing:.01em}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead small{color:var(--muted);font-weight:600;font-size:12px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* hero */
.hero{padding-block:6px 4px;display:flex;flex-direction:column;gap:8px}
.nw{font:800 clamp(34px,11vw,48px)/1 var(--display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,#d9f7e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#1b1406;background:linear-gradient(180deg,#f3d58c,var(--gold));padding:6px 10px;border-radius:999px}
.prog{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em-deep),var(--em));border-radius:999px}
.prog small{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:700 18px/1.15 var(--display);overflow-wrap:anywhere}
.stat b.em{color:var(--em)}.stat b.gold{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.chart svg{display:block;width:100%;height:120px}
.chartfoot{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;min-height:64px}
.row:active{background:var(--surface2)}
.tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#24332c,#141a17);border:1px solid var(--line)}
.tile.gold{background:radial-gradient(circle at 35% 30%,#4a3a17,#1c160a);border-color:#4a3c1c}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rmain strong{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain span{color:var(--muted);font-size:12.5px}
.rside{text-align:right;display:flex;flex-direction:column;gap:2px;flex:none}
.rside b{font-weight:800}
.rside span{font-size:12px;color:var(--muted)}
.up{color:var(--em)!important}.down{color:var(--red)!important}.goldt{color:var(--gold)!important}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:rgba(31,201,131,.14);color:var(--em)}
.pill.g{background:rgba(228,185,91,.15);color:var(--gold)}
.pill.r{background:rgba(255,107,98,.14);color:var(--red)}
.pill.m{background:var(--surface2);color:var(--muted)}
.locked{opacity:.5}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(180deg,#28d892,var(--em));color:#03140c;width:100%}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f2d27f,var(--gold));color:#1d1504}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,98,.14);color:var(--red);border:1px solid rgba(255,107,98,.3)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.three{grid-template-columns:repeat(3,1fr)}
.btns.four{grid-template-columns:repeat(4,1fr)}
.btns .btn{min-height:46px;padding:0 8px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:13.5px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.hustle{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.hustle .rmain span{font-size:12.5px}
.hustle .btn{grid-column:1/-1;min-height:48px}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.note{color:var(--dim);font-size:12px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(12,16,14,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.dock nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;color:var(--dim);font-size:10.5px;font-weight:800;letter-spacing:.03em}
.dock button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{color:var(--em)}
/* sheet */
.scrim{cursor:pointer;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .24s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0}
.sheet{cursor:auto}
.stop{display:flex;align-items:center;justify-content:space-between;margin-bottom:-6px}
.stop .grab{margin:0}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:16px;font-weight:800;display:grid;place-items:center}
.shead{display:flex;align-items:center;gap:12px}
.shead .tile{width:54px;height:54px;font-size:28px;border-radius:16px}
.shead h3{margin:0;font:700 18px/1.2 var(--display)}
.shead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kv b{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.sheet .big{font:800 30px/1.1 var(--display);text-align:center}
.sheet .sub{color:var(--muted);text-align:center;margin-top:-6px}
.lines{display:flex;flex-direction:column;gap:6px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.lines div b{color:var(--text);font-weight:800}
.welcome{font:800 13px/1 var(--display);letter-spacing:.2em;color:var(--gold);text-align:center;margin-top:6px}
.evtext{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,#2a2210,#1b160a);border:1px solid var(--gold-deep);color:var(--gold);font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);animation:drop .3s cubic-bezier(.2,1.4,.4,1)}
.toast.em{background:linear-gradient(180deg,#0f2a1e,#0a1b13);border-color:var(--em-deep);color:var(--em)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:3px}
.ach div b{font-size:13.5px}
.ach div span{font-size:12px;color:var(--muted)}
.ach div.got{border-color:var(--gold-deep);background:linear-gradient(180deg,#1f1a0d,var(--surface))}
.ach div.got b{color:var(--gold)}
.ms{display:flex;flex-direction:column;gap:6px}
.ms div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.ms div.got{border-color:var(--em-deep)}
.ms div.got b{color:var(--em)}
.ms div span{color:var(--muted)}
.timer{font-weight:800;color:var(--gold)}
.aucbid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.aucbid b{font:700 20px/1.1 var(--display)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>


<div class="app">
  <header class="top"><div class="brand">MILLIONAIRE <span>MODE</span></div><div class="topr"><button class="help" data-act="help" aria-label="How this screen works">?</button><div class="cashchip">Cash <b class="num" data-live="cash"></b></div></div></header>
  <main id="view"></main>
</div>
<div class="dock"><nav id="dock">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>Home</button>
  <button data-tab="market"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 10.5h-13z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg>Market</button>
  <button data-tab="invest"><svg viewBox="0 0 24 24"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg>Invest</button>

  <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
</nav></div>
<div id="sheetroot"></div>
<div id="toastroot"></div>

<script>
"use strict";
/* ================= helpers ================= */
const H = 3600000, MIN = 60000, CAP = 24 * H, KEY = "mm-save-v1";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return h>>>0}
const r01 = (...p) => h32(p.join("|")) / 4294967296;
function gauss(...p){const u=Math.max(1e-9,r01(...p,"a")),v=r01(...p,"b");return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function money(x, opts){
  opts = opts || {}; const neg = x < 0; x = Math.abs(x); let s;
  if (!opts.full && x >= 1e12) s = (x/1e12).toFixed(2) + "T";
  else if (!opts.full && x >= 1e9) s = (x/1e9).toFixed(2) + "B";
  else if (!opts.full && x >= 1e6) s = (x/1e6).toFixed(2) + "M";
  else if (x < 10000 && !opts.whole) s = x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  else s = Math.round(x).toLocaleString("en-US");
  return (neg ? "-$" : "$") + s;
}
const signed = x => (x >= 0 ? "+" : "") + money(x);
const pct = x => (x >= 0 ? "+" : "") + (x*100).toFixed(1) + "%";
function dur(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}h ${m}m`:m?`${m}:${String(ss).padStart(2,"0")}`:`0:${String(ss).padStart(2,"0")}`}
function ago(t){const d=Date.now()-t;return d<MIN?"just now":d<H?Math.floor(d/MIN)+"m ago":d<24*H?Math.floor(d/H)+"h ago":Math.floor(d/(24*H))+"d ago"}
let uidN = 0; const uid = () => Date.now().toString(36) + (uidN++).toString(36) + Math.floor(Math.random()*1e4).toString(36);

/* ================= catalog ================= */
const MS = [
  [100,"The Beginning"],[1e3,"Hustler"],[1e4,"Entrepreneur"],[5e4,"Business Owner"],[1e5,"Investor"],
  [5e5,"Mogul"],[1e6,"Millionaire"],[1e7,"Tycoon"],[1e8,"Empire Builder"],[1e9,"Billionaire"]
];
// cost = first location; rev/exp per hour per location
const BIZ = [
  {id:"vend",n:"Vending Machines",e:"🥤",t:0,cost:80,rev:40,exp:12},
  {id:"lawn",n:"Lawn Care Co.",e:"🌱",t:0,cost:450,rev:190,exp:70},
  {id:"wash",n:"Car Wash",e:"🧼",t:1,cost:2500,rev:1050,exp:420},
  {id:"truck",n:"Food Truck",e:"🌮",t:1,cost:12000,rev:4600,exp:1900},
  {id:"store",n:"Convenience Store",e:"🏪",t:2,cost:55000,rev:18500,exp:8200},
  {id:"rest",n:"Restaurant",e:"🍽️",t:3,cost:240000,rev:72000,exp:34000},
  {id:"plumb",n:"Plumbing Company",e:"🔧",t:4,cost:600000,rev:160000,exp:70000},
  {id:"auto",n:"Auto Repair Shop",e:"🛠️",t:4,cost:1400000,rev:330000,exp:140000},
  {id:"retail",n:"Retail Store",e:"🛍️",t:5,cost:2200000,rev:520000,exp:250000},
  {id:"build",n:"Construction Co.",e:"🏗️",t:5,cost:4000000,rev:900000,exp:420000},
  {id:"hotel",n:"Hotel",e:"🏨",t:6,cost:12e6,rev:2.4e6,exp:1.1e6},
  {id:"mfg",n:"Manufacturing Co.",e:"🏭",t:7,cost:45e6,rev:8e6,exp:3.9e6},
  {id:"recorp",n:"Real Estate Corp.",e:"🏢",t:7,cost:120e6,rev:19e6,exp:9e6},
  {id:"chain",n:"Hotel Chain",e:"🛎️",t:8,cost:300e6,rev:44e6,exp:21e6},
  {id:"dealer",n:"Dealership Network",e:"🚘",t:8,cost:650e6,rev:88e6,exp:42e6},
  {id:"tech",n:"Technology Company",e:"💻",t:9,cost:1.8e9,rev:230e6,exp:105e6},
  {id:"intl",n:"International Corp.",e:"🌐",t:9,cost:6e9,rev:700e6,exp:330e6}
];
const BIZM = Object.fromEntries(BIZ.map(b => [b.id, b]));
const PROP = [
  {id:"studio",n:"Studio Apartment",e:"🚪",t:2,base:14000},
  {id:"starter",n:"Starter Home",e:"🏠",t:3,base:46000},
  {id:"family",n:"Single-Family Home",e:"🏡",t:4,base:120000},
  {id:"duplex",n:"Duplex",e:"🏘️",t:4,base:260000},
  {id:"aptbld",n:"Apartment Building",e:"🏬",t:6,base:1.8e6},
  {id:"plaza",n:"Commercial Plaza",e:"🏦",t:6,base:6e6},
  {id:"mansion",n:"Luxury Mansion",e:"🏰",t:7,base:15e6},
  {id:"tower",n:"Skyscraper",e:"🌆",t:8,base:250e6}
];
const PROPM = Object.fromEntries(PROP.map(p => [p.id, p]));
// a = value drift per hour held, carry = insurance+maintenance per hour as share of value
const ITEMS = [
  {id:"hatch",c:"veh",n:"Used Hatchback",e:"🚗",t:1,base:6000,a:-.0012,carry:.00012},
  {id:"sedan",c:"veh",n:"Family Sedan",e:"🚙",t:2,base:24000,a:-.0008,carry:.00012},
  {id:"coupe",c:"veh",n:"Sports Coupe",e:"🏎️",t:3,base:70000,a:-.0004,carry:.00015},
  {id:"lux",c:"veh",n:"Luxury Sedan",e:"🚘",t:4,base:110000,a:-.0006,carry:.00015},
  {id:"classic",c:"veh",n:"'63 Classic Roadster",e:"🚕",t:4,base:180000,a:.0006,carry:.00012},
  {id:"super",c:"veh",n:"V12 Supercar",e:"🏁",t:5,base:350000,a:.0001,carry:.0002,set:"cars"},
  {id:"hyper",c:"veh",n:"Hybrid Hypercar",e:"⚡",t:7,base:2.5e6,a:.0003,carry:.0002,set:"cars"},
  {id:"proto",c:"veh",n:"One-Off Prototype",e:"🚀",t:8,base:12e6,a:.0005,carry:.0002,set:"cars"},

/* ================= economy curves ================= */

/* ================= engine: values ================= */
const bizMult = l => 1 + .5*l, expMult = l => 1 + .3*l;

function bizRev(id){ const o=S.biz[id]; return o ? BIZM[id].rev*o.n*bizMult(o.l)*setBonus() : 0; }
function bizExp(id){ const o=S.biz[id]; return o ? BIZM[id].exp*o.n*expMult(o.l) : 0; }
function modAt(id,t){ return S.mods.reduce((m,x) => (x.b==="*"||x.b===id) && t>=x.from && t<x.until ? m*x.m : m, 1); }
function bizNetAt(id,t){ return bizRev(id)*modAt(id,t) - bizExp(id); }
function bizEquity(id){ const o=S.biz[id]; return o ? o.spent*.6 : 0; }

function itemCarry(it,t){ return itemVal(it,t)*ITEMM[it.id].carry; }
function stockVal(){ return Object.entries(S.hold).reduce((a,[s,h]) => a + h.sh*S.stk[s].p, 0); }
function assetsVal(t){ t=t||Date.now(); return S.props.reduce((a,p)=>a+propVal(p,t),0) + S.items.reduce((a,i)=>a+itemVal(i,t),0) + stockVal(); }
function bizVal(){ return Object.keys(S.biz).reduce((a,id)=>a+bizEquity(id),0); }

  S.items.forEach(i => v -= itemCarry(i,t));
  return v;
}

/* income over [t0,t1] with event modifiers integrated exactly */
function incomeBetween(t0,t1){
  const lines=[]; let tot=0; const hrs=(t1-t0)/H; if (hrs <= 0) return {lines,total:0};
  Object.keys(S.biz).forEach(id => {
    const rev=bizRev(id); let r=rev*hrs;
    S.mods.forEach(m => { if (m.b==="*"||m.b===id){ const o=Math.max(0,Math.min(t1,m.until)-Math.max(t0,m.from)); r += rev*(m.m-1)*o/H; } });
    const amt = r - bizExp(id)*hrs; tot += amt; lines.push([BIZM[id].n, amt]);
  });
  let rent=0, pc=0;
  S.props.forEach(p => { if (p.rented){ const rh=Math.max(0,t1-Math.max(t0,p.renoUntil))/H; rent += propRent(p,t1)*rh; } pc += propCost(p,t1)*hrs; });
  if (S.props.length){ if (rent) lines.push(["Rental income", rent]); lines.push(["Property upkeep & taxes", -pc]); tot += rent - pc; }
  const carry = S.items.reduce((a,i)=>a+itemCarry(i,t1)*hrs,0);
  if (carry > 0){ lines.push(["Vehicle insurance & upkeep", -carry]); tot -= carry; }
  return {lines,total:tot};
}

/* ================= engine: time ================= */
function credit(amt){

}
function stepStocks(t){
  const target = Math.floor(t/MIN); let changed=false;
  STK.forEach(x => {
    const st = S.stk[x.s];
    if (target - st.n > 1440){ st.n = target - 1440; }
    while (st.n < target){
      st.n++;
      const z = gauss(x.s, st.n), cyc = (econ(st.n*MIN)-1)*.002;
      const ret = x.mu + cyc + x.sd*z;
      st.p = Math.max(x.p*.02, st.p*Math.exp(ret));
      st.hist.push(st.p); if (st.hist.length > 180) st.hist.shift();
      if (Math.abs(z) > 2.6 && target - st.n < 60 && x.s !== "BOND"){
        const up = z > 0, nm = x.n;
        const ups = [`${nm} jumps after a strong earnings report`,`Buyers pile into ${nm}`,`${nm} lands a major new contract`];
        const dns = [`${nm} slides on supply worries`,`Analysts cut their outlook on ${nm}`,`${nm} drops after a weak forecast`];
        const pick = (up?ups:dns)[Math.floor(r01(x.s,st.n,"nw")*3)];
        S.news.unshift({t:st.n*MIN, s:x.s, up, text:pick}); if (S.news.length > 14) S.news.length = 14;
      }
      changed = true;
    }
  });
  return changed;
}
function sample(t){ const lastS = S.hist[S.hist.length-1]; if (!lastS || t - lastS[0] >= 5*MIN){ S.hist.push([t, netWorth()]); if (S.hist.length > 240) S.hist.shift(); } }

/* advance the whole world to now; returns income summary for the gap */
function advance(t){
  const from = Math.max(S.last, t - CAP);

  S.props.forEach(p => { if (p.renoUntil && p.renoUntil <= t && p.cond < 100){ p.cond = 100; toast(`${p.name} renovation finished`, true); } });

}

function sparkSvg(vals, color){
  if (vals.length < 2) vals = [vals[0]||0, vals[0]||0];
  const W=320, Hh=120, pad=6, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||Math.max(1,mx*.02);
  const pts = vals.map((v,i)=>[pad+i*(W-2*pad)/(vals.length-1), Hh-pad-(v-mn)/rg*(Hh-2*pad)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1], gid="g"+Math.floor(Math.random()*1e6);
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${[.25,.5,.75].map(f=>`<line x1="0" x2="${W}" y1="${Hh*f}" y2="${Hh*f}" stroke="#1f2925" stroke-width="1"/>`).join("")}
  <path d="${d} L${last[0]} ${Hh} L${pts[0][0]} ${Hh} Z" fill="url(#${gid})"/>
  <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/></svg>`;
}

    <div class="stat"><span class="lbl">Lifetime earnings</span><b class="em num">${money(S.earned)}</b></div>
    <div class="stat"><span class="lbl">Peak net worth</span><b class="gold num">${money(S.peak)}</b></div>
    <div class="stat"><span class="lbl">Businesses</span><b class="num">${ownedBiz().reduce((a,id)=>a+S.biz[id].n,0)} locations</b></div>
    <div class="stat"><span class="lbl">Properties</span><b class="num">${S.props.length}</b></div>
    <div class="stat"><span class="lbl">Auctions won</span><b class="num">${S.aucWins}</b></div>
    <div class="stat"><span class="lbl">Shifts worked</span><b class="num">${S.shifts}</b></div>
  </div>
  <section class="sec"><div class="sechead"><h2>Milestones</h2></div><div class="ms">${MS.map((m,i)=>`<div class="${S.peak>=m[0]?"got":""}"><b>${m[1]}</b><span class="num">${money(m[0],{whole:true})}</span></div>`).join("")}</div></section>
  <section class="sec"><div class="sechead"><h2>Achievements</h2><small>${got} of ${ACH.length}</small></div><div class="ach">${ACH.map(a=>`<div class="${S.ach[a[0]]?"got":""}"><b>${a[1]}</b><span>${a[2]}</span></div>`).join("")}</div></section>
  <section class="sec"><div class="sechead"><h2>Collections</h2><small>+5% business income each</small></div><div class="list">${Object.entries(SETS).map(([k,st])=>{const have=st.ids.filter(id=>S.items.some(i=>i.id===id)).length;return rowHtml({e:ITEMM[st.ids[0]].e,gold:true,title:st.n,sub:st.ids.map(id=>ITEMM[id].n).join(", "),right:`<b class="${have===st.ids.length?"goldt":""}">${have}/${st.ids.length}</b>`});}).join("")}</div></section>
  <section class="sec"><div class="sechead"><h2>Transaction history</h2><small>${S.tx.length} recent</small></div>${S.tx.length?`<div class="list">${S.tx.slice(0,30).map(txRow).join("")}</div>`:`<div class="empty">Nothing yet.</div>`}</section>
  <section class="sec"><div class="sechead"><h2>Settings</h2></div><button class="btn danger" data-act="reset" id="resetbtn">Reset game</button><p class="note">Resetting erases all progress on this device and starts you over at $100.</p></section>`;
}

function render(){
  const v = {home:viewHome,market:viewMarket,invest:viewInvest,auctions:viewAuctions,profile:viewProfile}[tab]();
  $("view").innerHTML = v;
  document.querySelectorAll("#dock button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  liveTick(); needRender = false;
}

/* ================= sheets ================= */
function sheetBiz(id){ return () => {
  const b=BIZM[id], o=S.biz[id], t=Date.now(), n=o?o.n:0, lvl=o?o.l:0;
  const rev=o?bizRev(id)*modAt(id,t):b.rev, exp=o?bizExp(id):b.exp, c=unitCost(id), m=modAt(id,t);
  return `<div class="shead"><div class="tile">${b.e}</div><div><h3>${b.n}</h3><p>${o?`${n} location${n>1?"s":""} · Level ${lvl} of 5`:"Not owned yet"}</p></div></div>
  ${kv([["Revenue",money(rev)+"/h"],["Operating costs",money(exp)+"/h"],["Profit",signed(rev-exp)+"/h"],["Margin",Math.round((rev-exp)/rev*100)+"%"],["Reputation",(55+lvl*9)+" / 100"],["Equity",money(bizEquity(id))]])}
  ${m!==1?`<p class="note ${m>1?"up":"down"}">${m>1?"Boosted":"Slowed"} by a recent event.</p>`:""}
  <button class="btn" data-act="bizBuy" data-arg="${id}" ${c>S.cash||n>=25?"disabled":""}>${o?"Open location #"+(n+1):"Open for"} ${money(c)}</button>
  ${o?`<div class="btns"><button class="btn gold" data-act="bizUp" data-arg="${id}" ${lvl>=5||upCost(id)>S.cash?"disabled":""}>${lvl>=5?"Max level":"Upgrade "+money(upCost(id))}</button><button class="btn ghost" data-act="bizSell" data-arg="${id}">Sell one +${money(o.spent/o.n*.6)}</button></div><p class="note">Upgrades raise revenue 50% per level and costs 30%. Each new location costs 15% more than the last. Selling returns 60% of what you put into that location.</p>`:`<p class="note">Earns about ${money(b.rev-b.exp)} an hour per location, even while you're away (up to 24 hours).</p>`}`;
};}
function sheetProp(u){ return () => {
  const p=S.props.find(x=>x.uid===u); if (!p) return null; const d=PROPM[p.type], reno=p.renoUntil>Date.now(), v=propVal(p), into=p.paid+p.reno;
  return `<div class="shead"><div class="tile">${d.e}</div><div><h3>${p.name}</h3><p>${propCond(p.cond)} · ${p.rented?"Rented out":"Vacant"}</p></div></div>
  ${kv([["Market value",`<span data-live="pv:${u}"></span>`],["You put in",money(into)],["Rent (92% occupied)",money(propRent(p))+"/h"],["Upkeep & taxes",money(propCost(p))+"/h"],["Condition",p.cond+" / 100"],["Gain",`<span class="${v-into>=0?"up":"down"}">${signed(v-into)}</span>`]])}
  ${reno?`<p class="note goldt" data-live="reno:${u}"></p>`:""}
  ${p.cond<100&&!reno?`<button class="btn gold" data-act="propReno" data-arg="${u}" ${renoCost(p)>S.cash?"disabled":""}>Renovate for ${money(renoCost(p))} (adds ${money(propBaseVal({...p,cond:100})*econ(Date.now())-v)} value)</button>`:""}
  <div class="btns"><button class="btn ghost" data-act="propRent" data-arg="${u}">${p.rented?"Stop renting":"Rent it out"}</button><button class="btn" data-act="propSell" data-arg="${u}" ${reno?"disabled":""}>Sell ${money(v)}</button></div>
  <p class="note">Property values follow the economy's cycles. Renovation takes 3 minutes and pauses rent.</p>`;
};}
function sheetPListing(lid){ return () => {
  const l=propListings().find(x=>x.lid===lid); if (!l) return null; const d=PROPM[l.type], p={...l};
  return `<div class="shead"><div class="tile">${d.e}</div><div><h3>${d.n}</h3><p>${propCond(l.cond)} condition</p></div></div>
  ${kv([["Asking price",money(l.ask)],["Market value",money(l.val)],["Renovation cost",l.cond<100?money(renoCost(p)):"None"],["Value renovated",money(propBaseVal({...p,cond:100})*econ(Date.now()))],["Rent if leased",money(propRent(p))+"/h"],["Upkeep & taxes",money(propCost(p))+"/h"]])}
  <button class="btn" data-act="propBuy" data-arg="${lid}" ${l.ask>S.cash?"disabled":""}>Buy for ${money(l.ask)}</button>
  ${l.ask>S.cash?`<p class="note">You need ${money(l.ask-S.cash)} more cash.</p>`:""}`;
};}
function sheetListing(c,lid){ return () => {
  const l=itemListings(c).find(x=>x.lid===lid); if (!l) return null; const d=ITEMM[l.id];
  return `<div class="shead"><div class="tile${c==="col"?" gold":""}">${d.e}</div><div><h3>${d.n}</h3><p>${condName(l.cm)} condition</p></div></div>
  ${kv([["Asking price",money(l.ask)],["Market value",money(l.val)],["Trend",d.a>=0?`<span class="up">Gains value</span>`:`<span class="down">Loses value</span>`],["Carrying cost",d.carry?money(l.val*d.carry)+"/h":"None"],["Resale today",money(l.val)],["Set",d.set?SETS[d.set].n:"None"]])}
  <button class="btn" data-act="itemBuy" data-arg="${c}|${lid}" ${l.ask>S.cash?"disabled":""}>Buy for ${money(l.ask)}</button>
  ${l.ask>S.cash?`<p class="note">You need ${money(l.ask-S.cash)} more cash.</p>`:""}`;
};}
function sheetItem(u){ return () => {
  const i=S.items.find(x=>x.uid===u); if (!i) return null; const d=ITEMM[i.id], v=itemVal(i);
  return `<div class="shead"><div class="tile${d.c==="col"?" gold":""}">${d.e}</div><div><h3>${esc(i.name||d.n)}</h3><p>${condName(i.cm)} · held ${ago(i.at).replace(" ago","")}</p></div></div>
  ${kv([["Value now",`<span data-live="iv:${u}"></span>`],["You paid",money(i.paid)],["Gain",`<span class="${v-i.paid>=0?"up":"down"}">${signed(v-i.paid)}</span>`],["Carrying cost",d.carry?money(itemCarry(i))+"/h":"None"]])}
  <button class="btn" data-act="itemSell" data-arg="${u}">Sell for ${money(v)}</button>`;
};}
function sheetStock(s){ return () => {
  const x=STKM[s], st=S.stk[s], h=S.hold[s], val=h?h.sh*st.p:0, ref=st.hist[Math.max(0,st.hist.length-61)]||st.p;
  return `<div class="shead"><div class="tile gold" style="font:800 12px var(--display);color:var(--gold)">${s}</div><div><h3>${x.n}</h3><p>${x.k} · ${x.risk} risk</p></div></div>
  <div class="card chart" style="padding:10px">${sparkSvg(st.hist.slice(-120),st.p>=ref?"#1fc983":"#ff6b62")}<div class="chartfoot"><span>2h ago</span><span>now</span></div></div>
  ${kv([["Price",money(st.p)],["1h change",`<span class="${st.p>=ref?"up":"down"}">${pct(st.p/ref-1)}</span>`],["You hold",h?money(val):"Nothing"],["Profit / loss",h?`<span class="${val-h.cost>=0?"up":"down"}">${signed(val-h.cost)}</span>`:"—"]])}
  <div class="lbl">Buy with your cash (${money(S.cash)})</div>
  <div class="btns four">${[[.1,"10%"],[.25,"25%"],[.5,"50%"],[1,"Max"]].map(([f,n])=>`<button class="btn" data-act="stkBuy" data-arg="${s}|${f}" ${S.cash<.01?"disabled":""}>${n}</button>`).join("")}</div>
  ${h?`<div class="lbl">Sell your position</div><div class="btns three">${[[.25,"25%"],[.5,"50%"],[1,"All"]].map(([f,n])=>`<button class="btn ghost" data-act="stkSell" data-arg="${s}|${f}">${n}</button>`).join("")}</div>`:""}
  <p class="note">Simulated prices. Returns are never guaranteed.</p>`;
};}
function sheetLot(id){ return () => {
  const L=S.auc.find(x=>x.id===id); if (!L) return null; const lead=L.top==="you";
  return `<div class="shead"><div class="tile${L.mystery?" gold":""}">${lotIcon(L)}</div><div><h3>${lotName(L)}</h3><p>Ends in <span class="timer num" data-live="auc:${id}"></span></p></div></div>
  ${kv([["Current bid",money(L.cur)],["Next bid",money(nextBid(L))],["Est. value",L.mystery?"Unknown":money(L.val)],["Bidders",L.bidders]])}
  <button class="btn" data-act="bid" data-arg="${id}" ${lead||nextBid(L)>S.cash?"disabled":""}>${lead?"You have the top bid":"Bid "+money(nextBid(L))}</button>
  <div class="lbl">Bid history</div>${L.hist.length?`<div class="lines">${L.hist.map(b=>`<div><span>${b.w==="you"?"You":"Rival bidder"} · ${ago(b.t)}</span><b class="num">${money(b.a)}</b></div>`).join("")}</div>`:`<p class="note">No bids yet.</p>`}`;
};}
function showEvent(ev){
  S.evs++; let result=null;
  openSheet(() => result ? `<div class="welcome">${esc(ev.title.toUpperCase())}</div><p class="evtext" style="text-align:center">${esc(result)}</p><button class="btn" data-act="close">Continue</button>`
    : `<div class="shead"><div class="tile gold">${ev.icon}</div><div><h3>${esc(ev.title)}</h3><p>Decision needed</p></div></div><p class="evtext">${esc(ev.text)}</p>
       <div class="list">${ev.choices.map((c,i)=>`<button class="btn ${i===0?"":"ghost"}" data-act="evc" data-arg="${i}" ${c.cost&&c.cost>S.cash?"disabled":""}>${esc(c.label)}</button>`).join("")}</div>`, true);
  evChoose = i => { result = ev.choices[i].run(); save(); needRender = true; drawSheet(); };
}
let evChoose = null;
function showWelcome(inc, gap){
  if (Math.abs(inc.total) < .01) return;
  openSheet(() => `<div class="welcome">WELCOME BACK</div>
    <div class="big num ${inc.total>=0?"up":"down"}">${signed(inc.total)}</div>
    <p class="sub">You ${inc.total>=0?"earned":"spent"} this while you were away for ${dur(gap)}${gap>CAP?" (capped at 24 hours)":""}.</p>
    <div class="lines">${inc.lines.map(([n,a])=>`<div><span>${esc(n)}</span><b class="num ${a>=0?"up":"down"}">${signed(a)}</b></div>`).join("")}</div>
    <button class="btn" data-act="close">Collect</button>`, true);
}

/* ================= help & first-run guide ================= */
const GUIDE = [
  {tab:null,e:"💰",t:"Welcome to Millionaire Mode",p:"Start with $100. Turn it into $1 billion.",l:[
    "<b>Net worth</b> is your score: your cash plus everything you own.",
    "Businesses and rentals <b>earn money every second</b>, even with the app closed (up to 24 hours).",
    "Every choice can make you money <b>or lose it</b>. Nothing here is real money."]},
  {tab:"home",e:"🏠",t:"Home",p:"Your empire at a glance.",l:[
    "<b>Net worth</b> and the gold bar show how close you are to your next rank.",
    "<b>Passive income</b> is what you earn per day without lifting a finger.",
    "<b>Side hustle</b> pays a little cash once a minute. Great for getting started.",
    "<b>Opportunities</b> are items for sale below what they're worth."]},
  {tab:"market",e:"🛍️",t:"Market",p:"Where you buy things that make money.",l:[
    "<b>Businesses</b> earn every hour. Open more locations or upgrade to earn more.",
    "<b>Real estate</b> (from $10,000 net worth): buy cheap, renovate, then rent it out or sell it.",
    "<b>Vehicles and collectibles</b>: buy below value and sell higher. Everyday cars lose value; classics and watches gain.",
    "New listings show up every <b>20 minutes</b>."]},
  {tab:"invest",e:"📈",t:"Invest",p:"Stocks, funds and crypto. All fictional.",l:[
    "Prices move <b>every minute</b>, even while you're away.",
    "Tap one to see its chart, then <b>buy with a slice of your cash</b> (10%, 25%, 50% or all of it).",
    "Higher risk means bigger swings, up and down. <b>Bonds</b> are slow and steady; <b>MoonCoin</b> is a rollercoaster."]},
  {tab:"auctions",e:"🔨",t:"Auctions",p:"Bid against rival buyers.",l:[
    "Three auctions run at once. <b>Tap Bid</b> to raise the price; rivals will try to top you.",
    "A bid in the last 15 seconds <b>adds 15 seconds</b> to the clock.",
    "You only pay if you win. <b>Mystery storage units</b> could hold treasure or junk."]},
  {tab:"profile",e:"👤",t:"Profile",p:"Your rank, trophies and history.",l:[
    "<b>Milestones</b> unlock new businesses, properties and items as you get richer.",
    "<b>Achievements</b> track your firsts. <b>Collections</b> add +5% to all business income when complete.",
    "<b>Reset game</b> starts you over at $100."]},
  {tab:null,e:"⚡",t:"Expect surprises",p:"Every few minutes, something happens.",l:[
    "Breakdowns, rush hours, hot deals, tax audits. <b>You decide</b> how to handle each one.",
    "Some help you, some hurt. Choose carefully.",
    "Tap the gold <b>?</b> at the top any time to see how a screen works."]}
];
function guideCard(g){ return `<div class="shead"><div class="tile gold">${g.e}</div><div><h3>${g.t}</h3><p>${g.p}</p></div></div><ul class="ilist">${g.l.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`; }
let gStep = 0;
function openGuide(){ gStep = 0; openSheet(() => { const g = GUIDE[gStep], last = gStep === GUIDE.length-1;
  return `${guideCard(g)}<div class="dots">${GUIDE.map((_,i)=>`<i class="${i===gStep?"on":""}"></i>`).join("")}</div>
  <div class="btns">${gStep?`<button class="btn ghost" data-act="gback">Back</button>`:`<button class="btn ghost" data-act="gskip">Skip</button>`}<button class="btn ${last?"gold":""}" data-act="${last?"gdone":"gnext"}">${last?"Let's get rich":"Next"}</button></div>`; }, true); }
function openHelp(){ const g = GUIDE.find(x=>x.tab===tab) || GUIDE[0]; openSheet(() => `${guideCard(g)}<button class="btn ghost" data-act="gall">Show the full tour</button>`); }
function guideSeen(){ try { return localStorage.getItem("mm-guide") === "1"; } catch(e){ return true; } }
function markGuide(){ try { localStorage.setItem("mm-guide","1"); } catch(e){} }

/* ================= input ================= */
let resetArm = 0, pendingWelcome = null;
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb){ tab = tb.dataset.tab; try{localStorage.setItem("mm-tab",tab)}catch(_){} render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (act==="scrim"){ if (e.target===el && !sheetLocked) closeSheet(); return; }
  const run = fn => { fn(); progress(); save(); render(); drawSheet(); };
  switch(act){
    case "close": closeSheet(); render(); break;
    case "mcat": mcat=arg; try{localStorage.setItem("mm-mcat",mcat)}catch(_){} render(); break;
    case "hustle": run(A.hustle); break;
    case "openBiz": openSheet(sheetBiz(arg)); break;
    case "openProp": openSheet(sheetProp(arg)); break;
    case "openPListing": openSheet(sheetPListing(arg)); break;
    case "openListing": { const [c,l]=arg.split("|"); openSheet(sheetListing(c,l)); break; }
    case "openItem": openSheet(sheetItem(arg)); break;
    case "openStock": openSheet(sheetStock(arg)); break;
    case "openLot": openSheet(sheetLot(arg)); break;
    case "bizBuy": run(()=>A.bizBuy(arg)); break;
    case "bizUp": run(()=>A.bizUp(arg)); break;
    case "bizSell": run(()=>A.bizSell(arg)); if (!S.biz[arg]) closeSheet(); break;
    case "propBuy": run(()=>A.propBuy(arg)); { const p=S.props[S.props.length-1]; if (p && Date.now()-p.at<2000) openSheet(sheetProp(p.uid)); } break;
    case "propReno": run(()=>A.propReno(arg)); break;
    case "propRent": run(()=>A.propRent(arg)); break;
    case "propSell": run(()=>A.propSell(arg)); break;
    case "itemBuy": { const [c,l]=arg.split("|"); run(()=>A.itemBuy(c,l)); const i=S.items[S.items.length-1]; if (i && Date.now()-i.at<2000) openSheet(sheetItem(i.uid)); break; }
    case "itemSell": run(()=>A.itemSell(arg)); break;
    case "stkBuy": { const [s,f]=arg.split("|"); run(()=>A.stkBuy(s,+f)); break; }
    case "stkSell": { const [s,f]=arg.split("|"); run(()=>A.stkSell(s,+f)); break; }
    case "bid": run(()=>A.bid(arg)); break;
    case "evc": if (evChoose) evChoose(+arg); break;
    case "help": openHelp(); break;
    case "gall": openGuide(); break;
    case "gnext": gStep++; drawSheet(); break;
    case "gback": gStep--; drawSheet(); break;
    case "gskip": case "gdone": markGuide(); closeSheet(); render(); if (pendingWelcome){ const w=pendingWelcome; pendingWelcome=null; showWelcome(w[0],w[1]); } break;
    case "reset":
      if (Date.now()-resetArm < 4000){ S = fresh(); auctionsTick(Date.now()); save(); closeSheet(); tab="home"; render(); toast("New game. You have $100. Go."); resetArm=0; }
      else { resetArm = Date.now(); el.textContent = "Tap again to erase everything"; setTimeout(()=>{ const b=$("resetbtn"); if (b) b.textContent="Reset game"; }, 4000); }
      break;
  }
});

/* ================= loop ================= */
function boot(){
  const saved = load(), t = Date.now();
  S = saved || fresh();
  const gap = t - S.last;
  const r = advance(t);
  save(); render();
  if (!guideSeen()){ if (saved && gap > 60000) pendingWelcome = [r.inc, gap]; openGuide(); }
  else if (saved && gap > 60000) showWelcome(r.inc, gap);
}
function tick(){
  const t = Date.now(), gap = t - S.last;
  const r = advance(t);
  if (gap > 5*MIN && !sheetOpen()) showWelcome(r.inc, gap);
  if (r.changed && (tab==="invest" || tab==="auctions")) needRender = true;
  if (win(t) !== win(t-1000) && (tab==="market"||tab==="home")) needRender = true;
  maybeEvent(t);
  if (needRender) render(); else liveTick();
  if (sheetOpen() && r.changed) drawSheet(); else if (sheetOpen()) liveTick();
  if (t % 5000 < 1000) save();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { advance(Date.now()); save(); } else tick(); });
addEventListener("pagehide", () => { advance(Date.now()); save(); });
boot();
setInterval(tick, 1000);
</script>
