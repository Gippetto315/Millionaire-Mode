<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millionaire">
<meta name="theme-color" content="#090c0b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Millionaire Mode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, sticky cash bar on top, five-tab dock fixed to the bottom, bottom sheets for details */
:root{
  --bg:#090c0b;--surface:#121715;--surface2:#19201d;--line:#24302b;
  --text:#f1f5f2;--muted:#8b9a92;--dim:#5f6d66;
  --em:#1fc983;--em-deep:#0e7a4f;--gold:#e4b95b;--gold-deep:#8a6a22;--red:#ff6b62;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:600 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 75%,rgba(9,12,11,0));display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 14px}
.brand{font:800 12px/1 var(--display);letter-spacing:.14em;color:var(--gold)}
.brand span{color:var(--text)}
.topr{display:flex;align-items:center;gap:8px}
.help{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--gold);font:800 15px var(--display);display:grid;place-items:center}
.ilist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ilist li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--muted);font-size:14.5px;line-height:1.45}
.ilist li b{color:var(--text)}
.ilist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--em);margin:7px 0 0 7px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:20px;border-radius:9px}
.cashchip{display:flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.cashchip b{color:var(--em);font-weight:800}
h2{font:700 15px/1.2 var(--display);margin:0;letter-spacing:.01em}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead small{color:var(--muted);font-weight:600;font-size:12px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* hero */
.hero{padding-block:6px 4px;display:flex;flex-direction:column;gap:8px}
.nw{font:800 clamp(34px,11vw,48px)/1 var(--display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,#d9f7e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nwbtn{display:flex;flex-direction:column;gap:8px;text-align:left;padding:0}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font:800 10px/1 var(--body);letter-spacing:0;text-transform:none;margin-left:4px;vertical-align:1px}
.lvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#1b1406;background:linear-gradient(180deg,#f3d58c,var(--gold));padding:6px 10px;border-radius:999px}
.prog{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em-deep),var(--em));border-radius:999px}
.prog small{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:700 18px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.em{color:var(--em)}
.stat .unit{font-size:12px;color:var(--muted);font-weight:700;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .unit b{font:800 12px var(--body);color:#c48a22}.stat b.gold{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.chart svg{display:block;width:100%;height:120px}
.chartfoot{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;min-height:64px}
.row:active{background:var(--surface2)}
.tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#24332c,#141a17);border:1px solid var(--line)}
.tile.gold{background:radial-gradient(circle at 35% 30%,#4a3a17,#1c160a);border-color:#4a3c1c}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rmain strong{font-weight:800;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmain span{color:var(--muted);font-size:12.5px}
.rside{text-align:right;display:flex;flex-direction:column;gap:2px;flex:none}
.rside b{font-weight:800}
.rside span{font-size:12px;color:var(--muted)}
.sprow{display:flex;align-items:center;gap:10px;text-align:right}
.mini{width:40px;height:22px;flex:none}
.rmain .parts{font-size:12.5px;line-height:1.5}
.rmain .parts b{font-weight:800}
.up{color:var(--em)!important}.down{color:var(--red)!important}.goldt{color:var(--gold)!important}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:rgba(31,201,131,.14);color:var(--em)}
.pill.g{background:rgba(228,185,91,.15);color:var(--gold)}
.pill.r{background:rgba(255,107,98,.14);color:var(--red)}
.pill.m{background:var(--surface2);color:var(--muted)}
.locked{opacity:.5}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(180deg,#28d892,var(--em));color:#03140c;width:100%}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f2d27f,var(--gold));color:#1d1504}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,98,.14);color:var(--red);border:1px solid rgba(255,107,98,.3)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.three{grid-template-columns:repeat(3,1fr)}
.btns.four{grid-template-columns:repeat(4,1fr)}
.btns .btn{min-height:46px;padding:0 8px;font-size:14px}
.btn.stk{flex-direction:column;gap:1px;min-height:56px;line-height:1.1}
.btn.stk small{font-size:11.5px;font-weight:700;opacity:.75}
.amtrow{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px}
.amtrow .dollar{font:800 18px var(--display);color:var(--muted)}
.amtrow input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:700 17px var(--body);padding:10px 0;outline:none}
.amtrow .btn{width:auto;min-height:44px;padding:0 20px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:13.5px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.hustle{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.hustle .rmain span{font-size:12.5px}
.hustle .btn{grid-column:1/-1;min-height:48px}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.note{color:var(--dim);font-size:12px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(12,16,14,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.dock nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;color:var(--dim);font-size:10.5px;font-weight:800;letter-spacing:.03em}
.dock button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{color:var(--em)}
/* sheet */
.scrim{cursor:pointer;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .24s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0}
.sheet{cursor:auto}
.stop{display:flex;align-items:center;justify-content:space-between;margin-bottom:-6px}
.stop .grab{margin:0}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:16px;font-weight:800;display:grid;place-items:center}
.shead{display:flex;align-items:center;gap:12px}
.shead .tile{width:54px;height:54px;font-size:28px;border-radius:16px}
.shead h3{margin:0;font:700 18px/1.2 var(--display)}
.shead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kv b{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.sheet .big{font:800 30px/1.1 var(--display);text-align:center}
.sheet .sub{color:var(--muted);text-align:center;margin-top:-6px}
.lines{display:flex;flex-direction:column;gap:6px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.lines div b{color:var(--text);font-weight:800}
.welcome{font:800 13px/1 var(--display);letter-spacing:.2em;color:var(--gold);text-align:center;margin-top:6px}
.evtext{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,#2a2210,#1b160a);border:1px solid var(--gold-deep);color:var(--gold);font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);animation:drop .3s cubic-bezier(.2,1.4,.4,1)}
.toast.em{background:linear-gradient(180deg,#0f2a1e,#0a1b13);border-color:var(--em-deep);color:var(--em)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:3px}
.ach div b{font-size:13.5px}
.ach div span{font-size:12px;color:var(--muted)}
.ach div.got{border-color:var(--gold-deep);background:linear-gradient(180deg,#1f1a0d,var(--surface))}
.ach div.got b{color:var(--gold)}
.ms{display:flex;flex-direction:column;gap:6px}
.ms div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.ms div.got{border-color:var(--em-deep)}
.ms div.got b{color:var(--em)}
.ms div span{color:var(--muted)}
.timer{font-weight:800;color:var(--gold)}
.scrim.still,.scrim.still .sheet{animation:none}
.lot{display:flex;flex-direction:column;gap:12px}
.lot.head{border-color:var(--gold-deep);background:linear-gradient(180deg,#1f1a0d,var(--surface))}
.bidbox{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.bidbox b{font:800 clamp(28px,9vw,36px)/1 var(--display)}
.bidbox.lead{border-color:var(--em-deep)}.bidbox.behind{border-color:rgba(255,107,98,.45)}
.call{display:flex;align-items:center;justify-content:center;gap:8px;font:700 14px var(--display);color:var(--muted);min-height:22px}
.call i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.call span{margin-left:4px}
.call.s1 i:nth-child(1),.call.s2 i:nth-child(-n+2){background:var(--gold)}
.call.s1 span,.call.s2 span{color:var(--gold)}
.rivals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rv{font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.rv.out{opacity:.4;text-decoration:line-through}.rv.top{border-color:var(--red);color:var(--red)}
.sold{font:800 42px/1 var(--display);color:var(--gold);letter-spacing:.06em;transform:rotate(-6deg);border:4px solid var(--gold);border-radius:12px;padding:8px 18px;align-self:center;animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.scrim.still .sold{animation:none}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.rlog{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim);min-height:108px}
.rlog div:first-child{color:var(--text);font-weight:700}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 42%,#1b1810 0%,#0a0908 55%,#030303 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .glow{position:absolute;left:50%;top:42%;width:140vmin;height:140vmin;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(228,185,91,.10) 0 6deg,transparent 6deg 18deg);border-radius:50%;animation:sp-rays 14s linear infinite;opacity:0;animation-delay:.2s;animation-fill-mode:both}
#splash .glow{animation:sp-rays 14s linear infinite,sp-in .8s .9s ease-out both}
#spv{width:min(56vw,240px);height:auto;position:relative;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7));animation:sp-drop .9s cubic-bezier(.2,1.4,.4,1) both}
#spv .sp-handle{transform-box:view-box;transform-origin:256px 250px;animation:sp-spin 1.1s .55s cubic-bezier(.5,0,.2,1) both}
.sp-title{position:relative;text-align:center;display:flex;flex-direction:column;gap:6px}
.sp-title b{font:800 clamp(30px,10vw,46px)/1 var(--display);letter-spacing:.06em;background:linear-gradient(100deg,#7a5414 0%,#f9e7a2 25%,#c9952f 45%,#fff7d6 55%,#b8832a 75%,#f0d27c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-up .7s 1.1s cubic-bezier(.2,1.3,.4,1) both,sp-shine 2.4s 1.4s linear infinite}
.sp-title span{font:700 12px/1 var(--display);letter-spacing:.42em;color:var(--em);animation:sp-up .6s 1.35s ease-out both}
.sp-tag{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--dim);letter-spacing:.08em;animation:sp-in .6s 1.8s both}
.sp-coin{position:absolute;top:-90px;animation:sp-fall linear both;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.sp-coin.bill{animation-name:sp-flutter}
@keyframes sp-flutter{0%{transform:translate(0,0) rotate(0) rotateX(0)}25%{transform:translate(calc(var(--dx)*.4),27vh) rotate(calc(var(--r)*.3)) rotateX(60deg)}50%{transform:translate(calc(var(--dx)*-.2),55vh) rotate(calc(var(--r)*.6)) rotateX(0)}75%{transform:translate(calc(var(--dx)*.7),82vh) rotate(calc(var(--r)*.8)) rotateX(60deg)}100%{transform:translate(var(--dx),112vh) rotate(var(--r)) rotateX(0)}}
@keyframes sp-drop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-spin{0%{transform:rotate(0)}100%{transform:rotate(540deg)}}
@keyframes sp-up{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-in{from{opacity:0}to{opacity:1}}
@keyframes sp-rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sp-shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes sp-fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>


<div id="splash" role="img" aria-label="Millionaire Mode"><div class="glow"></div><svg id="spv" viewBox="40 40 432 432" aria-hidden="true"><defs>
<linearGradient id="sp-paper0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3dc"/><stop offset=".5" stop-color="#ecd9a8"/><stop offset="1" stop-color="#c9a865"/></linearGradient>
<linearGradient id="sp-note0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e9cc"/><stop offset="1" stop-color="#cfb27a"/></linearGradient>
<radialGradient id="sp-ink0" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#2a2620"/><stop offset=".7" stop-color="#0d0c0a"/><stop offset="1" stop-color="#030303"/></radialGradient>
<linearGradient id="sp-g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5414"/><stop offset=".2" stop-color="#f9e7a2"/><stop offset=".4" stop-color="#c9952f"/><stop offset=".55" stop-color="#fff7d6"/><stop offset=".75" stop-color="#b8832a"/><stop offset="1" stop-color="#6b4710"/></linearGradient>
<filter id="sp-sh0" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".6"/></filter>

/* ================= economy curves ================= */
function econ(t){const h=t/H;return 1+.06*Math.sin(2*Math.PI*h/30+1)+.03*Math.sin(2*Math.PI*h/7.3+2)}
function wob(id,t){const h=t/H,p1=8+r01(id,"p1")*20,p2=2+r01(id,"p2")*5;return 1+.06*Math.sin(2*Math.PI*h/p1+r01(id,"f1")*6.28)+.03*Math.sin(2*Math.PI*h/p2+r01(id,"f2")*6.28)}

/* ================= state ================= */
let S;
function fresh(){
  const t = Date.now(), stk = {};
  STK.forEach(x => { stk[x.s] = {n: Math.floor(t/MIN) - 120, p: x.p, hist: []}; });

}

/* ================= engine: values ================= */
const bizMult = l => 1 + .5*l, expMult = l => 1 + .3*l;
function setBonus(){ return 1 + .05*Object.keys(SETS).filter(k => setDone(k)).length; }
function setDone(k){ return SETS[k].ids.every(id => S.items.some(i => i.id === id)); }
function vehBonus(){ return 1 + S.items.reduce((m,i)=>Math.max(m, ITEMM[i.id].vb||0), 0)/100; }
const hasRide = () => S.items.some(i => ITEMM[i.id].c==="veh");
function bizRev(id){ const o=S.biz[id]; return o ? BIZM[id].rev*o.n*bizMult(o.l)*setBonus()*vehBonus() : 0; }
function bizExp(id){ const o=S.biz[id]; return o ? BIZM[id].exp*o.n*expMult(o.l) : 0; }
function modAt(id,t){ return S.mods.reduce((m,x) => (x.b==="*"||x.b===id) && t>=x.from && t<x.until ? m*x.m : m, 1); }
function bizNetAt(id,t){ return bizRev(id)*modAt(id,t) - bizExp(id); }
function bizEquity(id){ const o=S.biz[id]; return o ? o.spent*.6 : 0; }
function unitCost(id){ const o=S.biz[id]; return BIZM[id].cost*Math.pow(1.15, o ? o.n : 0); }
function upCost(id){ const o=S.biz[id]; return BIZM[id].cost*o.n*.75*(o.l+1); }
function propBaseVal(p){ return p.base*(.5+.5*p.cond/100); }
function propVal(p,t){ return propBaseVal(p)*econ(t||Date.now()); }
function propRent(p,t){ return propVal(p,t)*.006*.92; }
function propCost(p,t){ return p.base*.0012 + p.base*.0006; }
function renoCost(p){ return p.base*(100-p.cond)/100*.18; }
function itemVal(it,t){ t=t||Date.now(); const d=ITEMM[it.id]; return it.base*wob(it.id,t)*Math.exp(d.a*(t-it.at)/H); }
function itemCarry(it,t){ return itemVal(it,t)*ITEMM[it.id].carry; }
function stockVal(){ return Object.entries(S.hold).reduce((a,[s,h]) => a + h.sh*S.stk[s].p, 0); }
function assetsVal(t){ t=t||Date.now(); return S.props.reduce((a,p)=>a+propVal(p,t),0) + S.items.reduce((a,i)=>a+itemVal(i,t),0) + stockVal(); }
function bizVal(){ return Object.keys(S.biz).reduce((a,id)=>a+bizEquity(id),0); }
function netWorth(){ return S.cash + assetsVal() + bizVal() - 0; }
function perHour(t){
  t=t||Date.now(); let v=0;
  Object.keys(S.biz).forEach(id => v += bizNetAt(id,t));
  S.props.forEach(p => { if (p.rented && t >= p.renoUntil) v += propRent(p,t); v -= propCost(p,t); });
  S.items.forEach(i => v -= itemCarry(i,t));
  return v;
}

/* income over [t0,t1] with event modifiers integrated exactly */
function incomeBetween(t0,t1){
  const lines=[]; let tot=0; const hrs=(t1-t0)/H; if (hrs <= 0) return {lines,total:0};
  Object.keys(S.biz).forEach(id => {
    const rev=bizRev(id); let r=rev*hrs;
    S.mods.forEach(m => { if (m.b==="*"||m.b===id){ const o=Math.max(0,Math.min(t1,m.until)-Math.max(t0,m.from)); r += rev*(m.m-1)*o/H; } });
    const amt = r - bizExp(id)*hrs; tot += amt; lines.push([BIZM[id].n, amt]);
  });
  let rent=0, pc=0;
  S.props.forEach(p => { if (p.rented){ const rh=Math.max(0,t1-Math.max(t0,p.renoUntil))/H; rent += propRent(p,t1)*rh; } pc += propCost(p,t1)*hrs; });
  if (S.props.length){ if (rent) lines.push(["Rental income", rent]); lines.push(["Property upkeep & taxes", -pc]); tot += rent - pc; }
  const carry = S.items.reduce((a,i)=>a+itemCarry(i,t1)*hrs,0);
  if (carry > 0){ lines.push(["Vehicle insurance & upkeep", -carry]); tot -= carry; }
  return {lines,total:tot};
}

/* ================= engine: time ================= */
function credit(amt){
  if (amt >= 0){ S.cash += amt; S.earned += amt; }
  else S.cash = Math.max(0, S.cash + amt);
}
function stepStocks(t){
  const target = Math.floor(t/MIN); let changed=false;
  STK.forEach(x => {
    const st = S.stk[x.s];
    if (target - st.n > 1440){ st.n = target - 1440; }
    while (st.n < target){
      st.n++;
      const z = gauss(x.s, st.n), cyc = (econ(st.n*MIN)-1)*.002;
      const ret = x.mu + cyc + x.sd*z;
      st.p = Math.max(x.p*.02, st.p*Math.exp(ret));
      st.hist.push(st.p); if (st.hist.length > 180) st.hist.shift();
      if (Math.abs(z) > 2.6 && target - st.n < 60 && x.s !== "BOND"){
        const up = z > 0, nm = x.n;
        const ups = [`${nm} jumps after a strong earnings report`,`Buyers pile into ${nm}`,`${nm} lands a major new contract`];
        const dns = [`${nm} slides on supply worries`,`Analysts cut their outlook on ${nm}`,`${nm} drops after a weak forecast`];
        const pick = (up?ups:dns)[Math.floor(r01(x.s,st.n,"nw")*3)];
        S.news.unshift({t:st.n*MIN, s:x.s, up, text:pick}); if (S.news.length > 14) S.news.length = 14;
      }
      changed = true;
    }
  });
  return changed;
}
function sample(t){ const lastS = S.hist[S.hist.length-1]; if (!lastS || t - lastS[0] >= 5*MIN){ S.hist.push([t, netWorth()]); if (S.hist.length > 240) S.hist.shift(); } }

/* advance the whole world to now; returns income summary for the gap */
function advance(t){
  const from = Math.max(S.last, t - CAP);
  const inc = incomeBetween(from, t);
  credit(inc.total);
  S.pending += inc.total;
  S.pendParts = S.pendParts || {};
  inc.lines.forEach(([n,a]) => { S.pendParts[n] = (S.pendParts[n]||0) + a; });
  S.last = t;
  S.mods = S.mods.filter(m => m.until > t);
  { const w = "-" + win(t) + "-"; S.sold = S.sold.filter(l => l.includes(w)); }
  S.props.forEach(p => { if (p.renoUntil && p.renoUntil <= t && p.cond < 100){ p.cond = 100; toast(`${p.name} renovation finished`, true); } });
  const sc = stepStocks(t);
  const ac = lotsTick(t) | listingsTick(t);
  if (t - S.pendingAt >= 5*MIN){ if (Math.abs(S.pending) >= .01){ tx("income","Passive income",S.pending); S.tx[0].parts = Object.entries(S.pendParts||{}).filter(p=>Math.abs(p[1])>=.01).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])); } S.pending=0; S.pendParts={}; S.pendingAt=t; }
  progress();
  sample(t);
  return {inc, from, changed: sc || ac};
}

/* ================= progression ================= */

  const nw = netWorth(); if (nw > S.peak) S.peak = nw;
  let l = 0; MS.forEach((m,i) => { if (S.peak >= m[0]) l = i; });
  if (l > S.lvl){ S.lvl = l; toast(`Milestone: ${MS[l][1]}. New opportunities unlocked`); needRender = true; }
  checkAch();
}

/* ================= listings ================= */
const WIN = 20*MIN;
const win = t => Math.floor((t||Date.now())/WIN);
function itemListings(c){
  const w = win(), t = Date.now();
  const pool = ITEMS.filter(i => i.c===c && !i.hidden && i.t <= S.lvl+1);
  const out = [];
  const used = new Set();
  for (let k=0; k<(c==="col"?6:5) && pool.length; k++){
    let d, tries=0;
    do { d = pool[Math.floor(r01(c,w,k,"i",tries)*pool.length)]; tries++; } while (used.has(d.id) && tries < 8);
    used.add(d.id);
    const cm = COND[Math.floor(r01(c,w,k,"c")*4)][0];
    const base = d.base*cm*(.92+r01(c,w,k,"b")*.16);
    const val = base*wob(d.id,t);
    const ask = val*(.84+r01(c,w,k,"a")*.32);
    const lid = `${c}-${w}-${k}`;
    if (!S.sold.includes(lid)) out.push({lid,id:d.id,cm,base,val,ask});
  }
  return out;
}
function propListings(){
  const w = win(), t = Date.now();
  const pool = PROP.filter(p => p.t <= S.lvl+1);
  const out = [];
  for (let k=0; k<4 && pool.length; k++){
    const d = pool[Math.floor(r01("p",w,k,"i")*pool.length)];
    const cond = Math.round(20 + r01("p",w,k,"c")*70);
    const base = d.base*(.88+r01("p",w,k,"b")*.24);
    const p = {type:d.id,base,cond};
    const val = propVal(p,t);
    const ask = val*(.84+r01("p",w,k,"a")*.24);
    const lid = `p-${w}-${k}`;
    if (!S.sold.includes(lid)) out.push({lid,...p,val,ask});
  }
  return out;
}

/* ================= actions ================= */
function spend(amt, type, desc){ if (amt > S.cash + 1e-6) { toast("Not enough cash"); return false; } S.cash -= amt; tx(type, desc, -amt); return true; }
function gain(amt, type, desc){ S.cash += amt; tx(type, desc, amt); }
const A = {

  bizBuy(id){ const c=unitCost(id); const o=S.biz[id]; if ((o?o.n:0) >= 25) return; if (!spend(c,"buy",`Opened ${BIZM[id].n}${o?" location #"+(o.n+1):""}`)) return; const b=S.biz[id]||(S.biz[id]={n:0,l:0,spent:0}); b.n++; b.spent+=c; },

  bizBuyN(id,k){ for (let i=0;i<k;i++){ const o=S.biz[id]; if ((o?o.n:0)>=25 || unitCost(id)>S.cash+1e-6) break; A.bizBuy(id); } },
  bizSellN(id,k){ for (let i=0;i<k && S.biz[id];i++) A.bizSell(id); },
  bizSell(id){ const o=S.biz[id]; if (!o) return; const v=o.spent/o.n*.6; o.spent -= o.spent/o.n; o.n--; gain(v,"sell",`Sold a ${BIZM[id].n} location`); if (o.n<=0) delete S.biz[id]; },
  propBuy(lid){ const L=propListings().find(x=>x.lid===lid); if (!L) return; const d=PROPM[L.type]; if (!spend(L.ask,"buy",`Bought ${d.n}`)) return; S.sold.push(lid); S.props.push({uid:uid(),type:L.type,name:d.n,base:L.base,cond:L.cond,rented:false,renoUntil:0,paid:L.ask,reno:0,at:Date.now()}); },

  propRent(u){ const p=S.props.find(x=>x.uid===u); if (p){ p.rented=!p.rented; } },
  propSell(u){ const i=S.props.findIndex(x=>x.uid===u); if (i<0) return; const p=S.props[i]; if (p.renoUntil>Date.now()) { toast("Wait for the renovation to finish"); return; } const v=propVal(p); if (v > p.paid+p.reno) S.flips++; S.props.splice(i,1); gain(v,"sell",`Sold ${p.name}`); },
  itemBuy(c,lid){ const L=itemListings(c).find(x=>x.lid===lid); if (!L) return; const d=ITEMM[L.id]; if (!spend(L.ask,"buy",`Bought ${d.n}`)) return; S.sold.push(lid); S.items.push({uid:uid(),id:L.id,cm:L.cm,base:L.base,at:Date.now(),paid:L.ask}); },
  itemSell(u){ const i=S.items.findIndex(x=>x.uid===u); if (i<0) return; const it=S.items[i]; const v=itemVal(it); S.items.splice(i,1); gain(v,"sell",`Sold ${it.name||ITEMM[it.id].n}`); },
  stkBuy(s,f){ const amt = S.cash*f; if (amt < .01) { toast("Not enough cash"); return; } const p=S.stk[s].p; if (!spend(amt,"buy",`Bought ${s}`)) return; const h=S.hold[s]||(S.hold[s]={sh:0,cost:0}); h.sh += amt/p; h.cost += amt; },

let evOpen=false;
function maybeEvent(t){
  if (t < S.nextEv || sheetOpen()) return;
  /* bad luck is rare: never twice in a row, and at most one mishap every 2-4 hours */
  const badOk = !S.lastBad || t - S.lastBad > (2+Math.random()*2)*H;
  const pool = EVENTS.filter(e => e.ok() && e.id !== S.lastEv && (!e.bad || badOk));
  S.nextEv = t + (15+Math.random()*15)*MIN;
  if (!pool.length) return;
  let r = Math.random()*pool.reduce((a,e)=>a+e.w,0), pk = pool[0];
  for (const e of pool){ if ((r-=e.w) < 0){ pk=e; break; } }
  S.lastEv = pk.id; if (pk.bad) S.lastBad = t;
  const ev = pk.make();
  showEvent(ev);
}

function toast(msg, em){
  const r=$("toastroot"); const el=document.createElement("div"); el.className="toast"+(em?" em":""); el.textContent=msg;

}

function rowHtml(o){

function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div><span>${k}</span><b class="num">${v}</b></div>`).join("")}</div>`; }

function sparkSvg(vals, color){
  if (vals.length < 2) vals = [vals[0]||0, vals[0]||0];
  const W=320, Hh=120, pad=6, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||Math.max(1,mx*.02);
  const pts = vals.map((v,i)=>[pad+i*(W-2*pad)/(vals.length-1), Hh-pad-(v-mn)/rg*(Hh-2*pad)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1], gid="g"+Math.floor(Math.random()*1e6);
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${[.25,.5,.75].map(f=>`<line x1="0" x2="${W}" y1="${Hh*f}" y2="${Hh*f}" stroke="#1f2925" stroke-width="1"/>`).join("")}
  <path d="${d} L${last[0]} ${Hh} L${pts[0][0]} ${Hh} Z" fill="url(#${gid})"/>
  <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/></svg>`;
}

function liveTick(){
  document.querySelectorAll("[data-live]").forEach(el => {
    const [k, a] = el.dataset.live.split(":"); const f = LIVE[k]; if (!f) return; const v = f(a); if (el.textContent !== v) el.textContent = v;

}

    case "help": openHelp(); break;
    case "nwinfo": openSheet(sheetNW()); break;
    case "bkcopy": { advance(Date.now()); const code = "MM1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); const ta=$("bkt"); ta.value = code;
      const done = () => toast("Backup copied. Paste it in Notes.", true);
      try { navigator.clipboard.writeText(code).then(done, () => { ta.select(); toast("Press and hold the code, then tap Copy"); }); } catch(_) { ta.select(); toast("Press and hold the code, then tap Copy"); } break; }
    case "bkrest": {
      const raw = ($("bkt").value||"").trim();
      let data = null; try { if (raw.startsWith("MM1:")) data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4))))); } catch(_) {}
      if (!data || data.v !== 1){ toast("That code didn't work. Copy the whole thing and try again."); break; }
      if (Date.now() - resetArm < 4000){ S = data; S.last = Math.min(S.last, Date.now()); settleRoom(); advance(Date.now()); save(); markGuide(); resetArm = 0; tab = "home"; render(); toast(`Restored. Net worth ${money(netWorth())}`, true); }
      else { resetArm = Date.now(); el.textContent = "Tap again to replace this game"; setTimeout(()=>{ const b=$("bkrest"); if (b) b.textContent="Restore"; }, 4000); }
      break; }
    case "gall": openGuide(); break;
    case "gnext": gStep++; drawSheet(); break;
    case "gback": gStep--; drawSheet(); break;
    case "gskip": case "gdone": markGuide(); closeSheet(); render(); if (pendingWelcome){ const w=pendingWelcome; pendingWelcome=null; showWelcome(w[0],w[1]); } break;
    case "reset":
      if (Date.now()-resetArm < 4000){ S = fresh(); lotsTick(Date.now()); save(); closeSheet(); tab="home"; render(); toast("New game. You have $100. Go."); resetArm=0; }
      else { resetArm = Date.now(); el.textContent = "Tap again to erase everything"; setTimeout(()=>{ const b=$("resetbtn"); if (b) b.textContent="Reset game"; }, 4000); }
      break;
  }
});

/* ================= loop ================= */
function boot(){
  const saved = load(), t = Date.now();
  S = saved || fresh();
  settleRoom();
  const gap = t - S.last;
  const r = advance(t);
  save(); render();
  if (!guideSeen()){ if (saved && gap > 60000) pendingWelcome = [r.inc, gap]; openGuide(); }
  else if (saved && gap > 60000) showWelcome(r.inc, gap);
}
function tick(){
  const t = Date.now(), gap = t - S.last;
  const r = advance(t);
  if (gap > 5*MIN && !sheetOpen()) showWelcome(r.inc, gap);
  if (r.changed && (tab==="invest" || tab==="auctions")) needRender = true;
  if (win(t) !== win(t-1000) && (tab==="market"||tab==="home")) needRender = true;
  maybeEvent(t);
  if (needRender) render(); else liveTick();
  if (sheetOpen() && r.changed) drawSheet(); else if (sheetOpen()) liveTick();
  if (t % 5000 < 1000) save();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { advance(Date.now()); save(); } else tick(); });
addEventListener("pagehide", () => { advance(Date.now()); save(); });

/* ================= intro splash ================= */
(function(){
  const sp = $("splash"); if (!sp) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) setTimeout(() => { const COIN = '<svg viewBox="0 0 40 40" width="100%" height="100%"><circle cx="20" cy="21.5" r="18" fill="#7a5414"/><circle cx="20" cy="20" r="18" fill="#e4b95b"/><circle cx="20" cy="20" r="14.5" fill="#f3d27a" stroke="#a87726" stroke-width="1.6"/><text x="20" y="27" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="20" fill="#8a5f17">$</text><ellipse cx="14" cy="12" rx="6" ry="3" fill="#fff" opacity=".55" transform="rotate(-30 14 12)"/></svg>';
    const BILL = '<svg viewBox="0 0 72 34" width="100%" height="100%"><rect x="1" y="1" width="70" height="32" rx="3" fill="#85bb65" stroke="#2f5a24" stroke-width="2"/><rect x="5" y="5" width="62" height="24" rx="2" fill="none" stroke="#2f5a24" stroke-width="1.2"/><ellipse cx="36" cy="17" rx="10" ry="9" fill="#cfe6b8" stroke="#2f5a24" stroke-width="1.4"/><text x="36" y="22.5" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="15" fill="#1f3a17">$</text><text x="9" y="13" font-family="Georgia,serif" font-weight="900" font-size="8" fill="#1f3a17">100</text><text x="63" y="28" text-anchor="end" font-family="Georgia,serif" font-weight="900" font-size="8" fill="#1f3a17">100</text></svg>';
    for (let k=0;k<26;k++){ const bill = k%3===0, c=document.createElement("div"); c.className="sp-coin"+(bill?" bill":""); c.innerHTML = bill ? BILL : COIN;
    const sz = bill ? 62+Math.random()*20 : 30+Math.random()*16; c.style.width=sz+"px"; c.style.height=(bill?sz*.47:sz)+"px";
    c.style.left=(Math.random()*96-4)+"%"; c.style.setProperty("--dx",(Math.random()*120-60)+"px"); c.style.setProperty("--r",(bill?(Math.random()*240-120):(Math.random()*720-360))+"deg");
    c.style.animationDuration=(bill?2.4+Math.random()*1.2:1.5+Math.random()*1.1)+"s"; c.style.animationDelay=(Math.random()*1.3)+"s"; sp.appendChild(c); } }, 1300);
  let gone = false;
  const go = () => { if (gone) return; gone = true; sp.classList.add("out"); setTimeout(() => sp.remove(), 650); };
  sp.addEventListener("click", go);
  setTimeout(go, reduce ? 900 : 3400);
})();
boot();
setInterval(tick, 1000);
</script>
